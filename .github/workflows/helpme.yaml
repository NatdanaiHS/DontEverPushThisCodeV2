name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # added: lets us run a manual full-history scan from the Actions tab
  workflow_dispatch:

# TODO#0: Declare workflow permissions (least privilege, for this workflow only)
permissions:
  contents: read          # (a) read code
  security-events: write  # TODO#0a: (b) upload SARIF to the Security tab
  issues: write           # TODO#0b: (c) Gitleaks/Sonar comment on issues
  pull-requests: write    # TODO#0b: (c) Gitleaks/Sonar comment on PRs
  id-token: write         # TODO#0c: (d) OIDC token (no step uses it yet; remove it if unused)
  actions: read           # CodeQL/Gitleaks read workflow run info

jobs:
    # GATE#0: Secret scanning (TruffleHog + Gitleaks)
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#1: full history, so old commits that contain secrets get scanned too
                fetch-depth: 0

            - name: Run TruffleHog
              # pinned to a commit SHA (v3.99.8) instead of @main -> prevents supply-chain swaps
              uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb
              continue-on-error: true # NOT best practice, demo only
              with:
                path: ./
                # TODO#2: scan only the diff of this push/PR.
                # NOTE: the original `base: default_branch` + head on a push to main makes
                # base == HEAD -> TruffleHog exits "BASE and HEAD commits are the same" and scans nothing.
                base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
                head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                # TODO#3: report only verified (live) secrets
                extra_args: --only-verified

            # TODO#4: Gitleaks
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
              continue-on-error: true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
                GITLEAKS_ENABLE_SUMMARY: true

            # added: gitleaks-action only uploads the SARIF as an artifact, it does NOT
            # push it to the Security tab by itself, so upload it explicitly.
            - name: Upload Gitleaks SARIF to Security tab
              if: always() && hashFiles('results.sarif') != ''
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                sarif_file: results.sarif
                category: gitleaks

    # GATE#1a: SAST via SonarQube (SonarCloud)
    sast-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                # TODO#5: Sonar uses git blame for new-code detection -> full history
                fetch-depth: 0

            # TODO#6: SonarQube scan
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
              continue-on-error: true # NOT best practice, demo only
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                # the repo has no sonar-project.properties, so SonarCloud needs these
                # (change them to match the project key/org shown in SonarCloud)
                args: >
                  -Dsonar.projectKey=NatdanaiHS_DontEverPushThisCodeV2
                  -Dsonar.organization=natdanaihs

    # GATE#1b: SAST via CodeQL (results in GitHub Security tab)
    codeql-scan:
        runs-on: ubuntu-latest
        needs: secret-scanning
        if: ${{ !cancelled() }}
        strategy:
            matrix:
                # TODO#7: React + Next.js API routes are JavaScript (TS is covered by the same extractor)
                language: [ 'javascript-typescript' ]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                languages: ${{ matrix.language }}
                # TODO#8: security-and-quality already contains security-extended,
                # listing both is allowed (duplicates are de-duplicated) but redundant.
                queries: security-extended,security-and-quality

            # TODO#9: analyze step, one category per language
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                category: "/language:${{ matrix.language }}"

    # GATE#2: Dependency scanning via OWASP Dependency-Check (SARIF + HTML)
    dependency-scanning:
        runs-on: ubuntu-latest
        needs: [sast-scan, secret-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#10: Node 20
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            # TODO#11: install deps from the lockfile
            - name: Install dependencies
              run: npm ci

            - name: Depcheck
              uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
              continue-on-error: true # NOT best practice, demo only
              id: Depcheck
              with:
                project: 'DontEverPushThisCodeV2'
                path: '.'
                # TODO#12: SARIF goes to the Security tab, HTML is for humans (artifact)
                format: 'SARIF'
                out: 'reports'
                # TODO#13: CVSS 7.0+ = HIGH -> fail the gate
                # (extra --format HTML so the artifact also has a human-readable report)
                args: >
                    --format HTML
                    --failOnCVSS 7
                    --enableRetired

            # TODO#14: Depcheck SARIF -> Security tab
            - name: Upload Depcheck SARIF to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                  sarif_file: reports/dependency-check-report.sarif
                  category: dependency-check

            # TODO#15: raw report folder as an artifact
            - name: Upload Depcheck HTML report as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: depcheck-report
                path: reports/

    # GATE#3: Container/Image scanning via Trivy (SARIF + artifact)
    image-scanning:
        runs-on: ubuntu-latest
        needs: [dependency-scanning]
        if: ${{ !cancelled() }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # TODO#16: build the image
            - name: Build Docker image
              run: docker build -t my-app:latest .

            - name: Trivy Scan
              # NOT @master: trivy-action tags were hijacked in March 2026 (CVE-2026-33634)
              # and leaked CI secrets. Pin to a commit SHA of a known-good release.
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              continue-on-error: true
              with:
                image-ref: 'my-app:latest'
                # TODO#17
                format: 'sarif'
                output: 'trivy-results.sarif'
                # TODO#18: only block/report what we really have to act on
                severity: 'HIGH,CRITICAL'
                # without this, SARIF output ignores `severity` and includes everything
                limit-severities-for-sarif: true
                # TODO#19: skip CVEs with no fix yet (nothing we can patch); review them separately
                ignore-unfixed: true
                exit-code: '1'

            # TODO#20: Trivy SARIF -> Security tab
            - name: Upload Trivy SARIF to Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              continue-on-error: true
              with:
                sarif_file: trivy-results.sarif
                category: trivy

            # TODO#21: raw SARIF as an artifact
            - name: Upload Trivy SARIF as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: trivy-report
                path: trivy-results.sarif

    # GATE#4: IaC scanning - skipped (out of scope)
    # GATE#5: DAST - covered by the OWASP ZAP workshop
